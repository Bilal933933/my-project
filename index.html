<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <!-- tilwind css -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Document</title>
</head>

<body class="bg-gray-600 text-white">
    <header class="bg-gray-900">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <!-- Logo / Title -->
            <h1 class="text-2xl font-bold text-white">
                My<span class="text-indigo-500">Website</span>
            </h1>

            <!-- Navigation -->
            <nav>
                <ul class="flex items-center space-x-8 text-gray-300">
                    <li>
                        <a href="#" class="hover:text-white transition-colors duration-200">
                            Home
                        </a>
                    </li>
                    <li>
                        <a href="#" class="hover:text-white transition-colors duration-200">
                            About
                        </a>
                    </li>
                    <li>
                        <a href="#" class="hover:text-white transition-colors duration-200">
                            Contact
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Auth Buttons -->
            <div class="flex items-center space-x-4">
                <button class="px-4 py-2 text-gray-300 hover:text-white transition-colors duration-200">
                    Login
                </button>
                <button
                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-500 transition-colors duration-200">
                    Sign Up
                </button>
            </div>

        </div>
    </header>

    <main>
        <!-- hearo -->
        <section class="bg-gray-900 text-white">
            <div class="max-w-7xl mx-auto px-6 py-20 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">

                <!-- Text Content -->
                <div>
                    <h1 class="text-4xl md:text-5xl font-extrabold leading-tight">
                        Build Your
                        <span class="text-indigo-500">Modern Website</span>
                    </h1>

                    <p class="mt-6 text-gray-300 max-w-lg">
                        Create clean, responsive, and professional web experiences using
                        modern tools and best practices.
                    </p>

                    <div class="mt-8 flex items-center space-x-4">
                        <button onclick="handelclick()"
                            class="px-6 py-3 bg-indigo-600 rounded-lg font-medium hover:bg-indigo-500 transition duration-200">
                            Get Started
                        </button>

                        <button
                            class="px-6 py-3 border border-gray-600 rounded-lg text-gray-300 hover:text-white hover:border-gray-400 transition duration-200">
                            Learn More
                        </button>
                    </div>
                </div>

                <!-- Image -->
                <div class="relative">
                    <img src="https://picsum.photos/500/400" alt="Hero Image" class="rounded-2xl shadow-2xl" />

                    <!-- Decorative blur -->
                    <div class="absolute -top-6 -right-6 w-40 h-40 bg-indigo-600 opacity-30 blur-3xl rounded-full">
                    </div>
                </div>

            </div>
        </section>


    </main>
    <footer>
        <div>
            <p>Copyright 2022</p>
        </div>
    </footer>
    <script src="index.js"></script>
</body>

</html>
